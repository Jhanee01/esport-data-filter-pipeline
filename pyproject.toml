[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-signal-pipeline"
version = "0.1.0"
description = "Odds feed → pluggable strategies → Telegram signals → automatic results, with a desktop dashboard and a Strategy Lab."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "János Halász" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.6", "qt-material>=2.14"]
remote = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
signal-pipeline = "signal_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_pipeline = ["remote/static/*.html", "ui/theme_fdb900.xml", "ui/assets/*.png", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
