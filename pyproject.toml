[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-signal-pipeline"
version = "0.1.0"
description = "Odds feed → pluggable strategies → Telegram signals → automatic results, with a desktop dashboard and a Strategy Lab."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "János Halász" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.6", "qt-material>=2.14", "numpy>=1.26", "matplotlib>=3.8"]
remote = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
signal-pipeline = "signal_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_pipeline = ["remote/static/*.html", "ui/theme_fdb900.xml", "ui/assets/*.png", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

# Views taken over verbatim from the original dashboard: only check them for real errors,
# not for style, so they stay as close to the original as possible.
[tool.ruff.lint.per-file-ignores]
"src/signal_pipeline/ui/{sidebar,dashboard_view,tips_view,stats_view,feed_view,log_view,toast}.py" = ["E", "W", "I", "B", "UP", "F841"]
"src/signal_pipeline/ui/compat/stats_manager.py" = ["E", "W", "I", "B", "UP"]
